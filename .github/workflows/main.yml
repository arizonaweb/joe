name: Deploy to GitHub Pages

on:
  push:
    branches: ["luxury-studio-intake"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: Configure GitHub Pages to use gh-pages
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.pages.createPagesSite({
                owner,
                repo,
                source: {
                  branch: 'gh-pages',
                  path: '/',
                },
              });
              core.info('Pages site created to use gh-pages branch.');
            } catch (err) {
              try {
                await github.rest.pages.updateSite({
                  owner,
                  repo,
                  source: {
                    branch: 'gh-pages',
                    path: '/',
                  },
                });
                core.info('Pages site updated to use gh-pages branch.');
              } catch (err2) {
                core.info('Could not create or update Pages site: ' + err2.message);
                throw err2;
              }
            }
